[package]
name = "torogao-coin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Clean-room coin-dynamic systems for the Torogao remake programme: the timed amplitude swing, three-stat preparation economy, and level-scaled resistance measured from RJ318915 (COIN-DYNAMIC.md), rebuilt as Torogao data + systems. No studied-game assets, text, or code."

[dependencies]
ron = "0.8"
serde = { workspace = true }

[[bin]]
name = "coin-smoke"
path = "src/main.rs"

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"
version = "0.4.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
