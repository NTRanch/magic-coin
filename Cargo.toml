# magic-coin standalone workspace (D-1568): the torogao-coin systems
# crate plus its Android spike shell, mirrored from the Torogao
# workspace in workspace shape. The Torogao app host consumes
# torogao-coin from the Torogao repo; it is not part of this artefact.
[workspace]
members = [
    "crates/torogao-coin",
    "crates/torogao-coin-android",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"
version = "0.4.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
